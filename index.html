<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F6E7C6" />
<title>love letter ♥</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="loveletter">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7EBD3; --cream2:#FDF6E4; --panel:#FFFFFF;
    --wood:#5C3A2A; --wood2:#B08668; --soft:#C98F7E;
    --blush:#FBEDE6; --red:#E2453E; --ink:#5C3A2A;
    --pixel:"Silkscreen", ui-monospace, "Courier New", monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:var(--pixel); letter-spacing:.5px; -webkit-font-smoothing:none;
    display:flex; align-items:center; justify-content:center;
    padding:0; overflow:hidden;
  }
  button{font-family:var(--pixel); color:var(--ink); cursor:pointer;}
  svg{display:block; shape-rendering:crispEdges;}

  /* ---------- ikon widget ---------- */
  #launcher{
    position:relative; width:70px; height:70px; padding:0;
    background:var(--blush); border:4px solid var(--wood);
    display:flex; align-items:center; justify-content:center;
  }
  #launcher:active{transform:translate(3px,3px);}
  #launcher>svg{width:36px;height:36px;}
  #bang{
    position:absolute; top:-15px; right:-15px; width:32px; height:32px;
    background:var(--red); border:4px solid var(--wood);
    display:none; align-items:center; justify-content:center;
  }
  #bang.on{display:flex; animation:hop .5s steps(2) 3;}
  #bang svg{width:12px;height:20px;}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @media (prefers-reduced-motion:reduce){#bang.on{animation:none;}}

  #made{
    position:fixed; right:14px; bottom:12px; z-index:5;
    font-size:9px; letter-spacing:1.5px; color:var(--wood2);
  }
  body.open #made{display:none;}

  /* ---------- layar login ---------- */
  #login{
    position:fixed; inset:0; background:var(--cream); z-index:20;
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  #login.on{display:flex;}
  .loginbox{
    width:100%; max-width:300px; background:var(--cream2);
    border:5px solid var(--wood);
    box-shadow:inset 0 0 0 4px var(--cream2), inset 0 0 0 8px var(--wood);
    padding:22px; text-align:center;
  }
  .lgt{font-size:13px; margin:0 0 14px; letter-spacing:1px;}
  #login input{
    width:100%; font-family:var(--pixel); font-size:12px; letter-spacing:.5px;
    padding:9px; margin-bottom:9px; color:var(--ink);
    background:var(--panel); border:3px solid var(--soft); outline:none;
  }
  #login input:focus{border-color:var(--wood2);}
  #masuk{
    width:100%; font-size:13px; padding:9px; margin-top:4px;
    background:var(--blush); border:3px solid var(--wood);
  }
  #masuk:active{transform:translate(2px,2px);}
  #lgerr{font-size:9px; color:var(--red); min-height:13px; margin:10px 0 0; line-height:1.6;}

  /* ---------- jendela ---------- */
  #win{
    display:none; width:100%; height:100%;
    background:var(--cream); border:5px solid var(--wood);
    box-shadow:inset 0 0 0 4px var(--cream2), inset 0 0 0 9px var(--wood);
    padding:17px; gap:12px; flex-direction:column;
  }
  body.open #win{display:flex;}
  body.open #launcher{display:none;}

  .top{display:flex; gap:12px; flex:1; min-height:0;}
  #screen{
    flex:1; min-width:0; position:relative;
    background:var(--panel); border:4px solid var(--soft); overflow:hidden;
  }
  #msgs{position:absolute; inset:0; overflow-y:auto; padding:10px;}
  #empty{font-size:11px; color:var(--wood2); text-align:center; margin-top:34px; line-height:1.9;}

  .row{display:flex; gap:6px; align-items:flex-end; margin-bottom:10px;}
  .row.theirs{flex-direction:row-reverse;}
  .bubble{
    max-width:74%; border:3px solid var(--soft); background:var(--cream2);
    padding:6px 8px; font-size:12px; line-height:1.7; word-break:break-word; white-space:pre-wrap;
  }
  .b-avocado{background:#FCDCC6; border-color:#F2662C;}
  .b-banana{background:#CDEFFA; border-color:#2FB4D6;}
  .sp{width:100%; height:100%; display:block; image-rendering:pixelated;}
  .meta{display:flex; flex-direction:column; align-items:flex-end; gap:2px; padding-bottom:2px;}
  .time{font-size:8px; color:var(--wood2);}
  .tick{font-size:8px; color:var(--wood2); display:flex; align-items:center; gap:3px; white-space:nowrap;}
  .tick svg{width:10px;height:8px;}
  .tick.read{color:var(--red);}
  .av{width:26px;height:26px;flex:0 0 26px;border:3px solid var(--soft);}
  .av img{width:100%;height:100%;}

  /* ---------- kolom kanan ---------- */
  .side{width:96px; flex:0 0 96px; display:flex; flex-direction:column; gap:9px;}
  .portrait{width:96px; height:96px; border:4px solid var(--wood); position:relative;}
  .portrait img{width:100%;height:100%;}
  .here{
    position:absolute; bottom:-4px; left:-4px; right:-4px;
    font-size:8px; text-align:center; padding:2px 0;
    background:var(--wood); color:var(--cream2);
  }
  .pad{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .key{
    aspect-ratio:1/1; padding:0; background:var(--cream2);
    border:4px solid var(--wood2); box-shadow:inset -3px -3px 0 var(--blush);
    display:flex; align-items:center; justify-content:center;
  }
  .key:active{transform:translate(2px,2px);}
  .key svg{width:22px;height:22px;}
  .key.off{opacity:.4;}
  .key.on{background:var(--blush); border-color:var(--red);}

  /* ---------- bawah ---------- */
  .bottom{display:flex; gap:12px; align-items:center;}
  .mine-face{width:76px; height:76px; flex:0 0 76px; border:4px solid var(--wood);}
  .mine-face img{width:100%;height:100%;}
  .field{
    flex:1; min-width:0; display:flex; align-items:center; gap:6px;
    background:var(--cream2); border:4px solid var(--soft); padding:4px 6px;
  }
  #text{
    flex:1; min-width:0; border:0; outline:0; background:transparent;
    font-family:var(--pixel); font-size:13px; letter-spacing:.5px; color:var(--ink); padding:10px 2px;
  }
  #go{width:34px; height:34px; padding:0; background:var(--blush); border:3px solid var(--wood2);
      display:flex; align-items:center; justify-content:center;}
  #go:active{transform:translate(2px,2px);}
  #go svg{width:16px;height:16px;}
  .del{
    font-size:8px; padding:2px 5px; margin-top:2px; color:var(--red);
    background:var(--cream2); border:2px solid var(--red); letter-spacing:1px;
  }
  .del:active{transform:translate(1px,1px);}
  .foot{display:flex; align-items:center; gap:10px; justify-content:flex-end; margin-top:-6px;}
  #wipe{
    font-size:8px; padding:3px 6px; color:var(--wood2); letter-spacing:1px;
    background:transparent; border:2px solid var(--wood2);
  }
  #wipe.armed{color:var(--red); border-color:var(--red);}
  #note{font-size:8px; color:var(--wood2); min-height:11px; text-align:right; margin-top:-6px;}

  /* ---------- stiker ---------- */
  #stickers{
    position:absolute; right:8px; bottom:8px; background:var(--cream2);
    border:4px solid var(--wood); padding:6px; display:none;
    grid-template-columns:1fr 1fr; gap:6px; z-index:5;
  }
  #stickers.on{display:grid;}
  #stickers button{font-size:11px; padding:6px 8px; background:var(--blush); border:3px solid var(--wood2);}

  /* ---------- adegan cium ---------- */
  #kiss{position:absolute; inset:0; display:none; overflow:hidden; cursor:pointer;
        background:#9FE4F5; transition:background 1.2s linear;}
  #kiss.on{display:block;}
  #kiss[data-phase="pagi"] {background:linear-gradient(#A8E2F7 0%, #FFEDD0 82%);}
  #kiss[data-phase="siang"]{background:linear-gradient(#5FCDF0 0%, #C9F1FB 78%);}
  #kiss[data-phase="sore"] {background:linear-gradient(#6B4B8A 0%, #EE8055 52%, #FBC96E 84%);}
  #kiss[data-phase="malam"]{background:linear-gradient(#0D1738 0%, #2A2F62 68%, #4A3F73 100%);}

  .orb{position:absolute; width:34px; height:34px; display:none;}
  .orb svg{width:100%;height:100%;}
  #kiss[data-phase="pagi"]  .sun{display:block; left:13%; top:24%;}
  #kiss[data-phase="siang"] .sun{display:block; left:50%; top:9%; margin-left:-17px;}
  #kiss[data-phase="sore"]  .sun{display:block; left:74%; top:50%;}
  #kiss[data-phase="malam"] .moon{display:block; left:72%; top:13%;}

  .star{position:absolute; width:3px; height:3px; background:#FFF6D8; display:none;
        animation:twinkle 3s steps(2) infinite;}
  #kiss[data-phase="malam"] .star{display:block;}
  @keyframes twinkle{0%,70%{opacity:1}85%{opacity:.25}100%{opacity:1}}

  .cloud{position:absolute; background:#FFFFFF;}
  .cloud::before{content:""; position:absolute; background:#FFFFFF;}
  .c1{width:52px;height:12px;top:26px;left:26px;}
  .c1::before{width:26px;height:12px;top:-12px;left:12px;}
  .c2{width:38px;height:10px;top:54px;right:34px;}
  .c2::before{width:18px;height:10px;top:-10px;left:8px;}
  .c3{width:30px;height:8px;top:18px;right:70px;}
  .c4{width:44px;height:10px;top:82px;left:16%;}
  .c4::before{width:22px;height:10px;top:-10px;left:10px;}
  .c5{width:34px;height:9px;top:44px;left:44%;}
  .c5::before{width:16px;height:9px;top:-9px;left:8px;}
  .c4,.c5{display:none;}
  #kiss[data-phase="pagi"] .c4, #kiss[data-phase="pagi"] .c5{display:block;}
  #kiss[data-phase="sore"] .cloud{background:#FFD9BC;}
  #kiss[data-phase="sore"] .cloud::before{background:#FFD9BC;}
  #kiss[data-phase="malam"] .cloud{background:#3A3F72;}
  #kiss[data-phase="malam"] .cloud::before{background:#3A3F72;}
  #kiss[data-phase="malam"] .c3{display:none;}

  .grass{position:absolute; left:0; right:0; bottom:0; height:56px; background:#7CC95B;
         border-top:6px solid #5FAE43;}
  .blade{position:absolute; bottom:44px; width:4px; height:10px; background:#5FAE43;}
  .flower{position:absolute; width:9px; height:9px;}
  .flower svg{width:100%;height:100%;}
  #kiss[data-phase="malam"] .grass{background:#31663F; border-top-color:#255030;}
  #kiss[data-phase="malam"] .blade{background:#255030;}
  #kiss[data-phase="sore"] .grass{background:#6FB04F; border-top-color:#538F3B;}
  #kiss[data-phase="sore"] .blade{background:#538F3B;}

  .swingpos{position:absolute; left:50%; bottom:44px; transform:translateX(-50%);}
  .swing{position:relative; transform-origin:50% -185px;}
  .rope, .seat{display:none;}
  .pair{display:flex; align-items:flex-end; gap:20px;}

  /* malam: duduk di ayunan sambil lihat bintang */
  .frame{display:none;}
  #kiss[data-phase="malam"]{--rope:150px; --sit:104px; --foot:44px;}
  #kiss[data-phase="malam"] .frame{
    display:block; position:absolute; left:50%; transform:translateX(-50%);
    bottom:var(--foot); width:150px;
    height:calc(var(--sit) + 6px + var(--rope) - var(--foot));
  }
  .beam{position:absolute; top:0; left:-19px; right:-19px; height:9px;
        background:#8A6B4C; border-bottom:3px solid #5E4732;}
  .leg{position:absolute; top:4px; width:8px; height:100%;
       background:#7E6348; border-left:3px solid #9B7C5C;}
  .leg.ll{left:-14px;}
  .leg.rr{right:-14px;}

  #kiss[data-phase="malam"] .swingpos{bottom:var(--sit);}
  #kiss[data-phase="malam"] .swing{
    animation:sway 6s ease-in-out infinite alternate;
    transform-origin:50% calc(67px - var(--rope) - 6px);
  }
  #kiss[data-phase="malam"] .rope{
    display:block; position:absolute; bottom:6px; width:3px; height:var(--rope); background:#6E5C46;
  }
  #kiss[data-phase="malam"] .rl{left:2px;}
  #kiss[data-phase="malam"] .rr{right:2px;}
  #kiss[data-phase="malam"] .seat{
    display:block; position:absolute; left:-13px; right:-13px; bottom:0; height:9px;
    background:#7E6348; border-top:3px solid #9B7C5C;
  }
  #kiss[data-phase="malam"] .pair{gap:4px; padding-bottom:9px;}
  #kiss[data-phase="malam"] .pair .ch{width:58px; height:58px;}
  #kiss[data-phase="malam"] .pair.kissing .ch img{filter:brightness(0);}
  #kiss[data-phase="malam"] .pair.kissing .ch.l{transform:translateX(6px) rotate(11deg);}
  #kiss[data-phase="malam"] .pair.kissing .ch.r{transform:translateX(-6px) rotate(-11deg);}
  #kiss[data-phase="malam"] .pair .ch img{transition:filter .25s steps(2);}
  @keyframes sway{from{transform:rotate(-2.5deg)} to{transform:rotate(2.5deg)}}
  @media (prefers-reduced-motion:reduce){#kiss[data-phase="malam"] .swing{animation:none;}}
  .pair .ch{width:78px; height:78px; transition:transform .18s steps(3); transform-origin:bottom center;}
  .pair .ch img{width:100%;height:100%;}
  .pair.kissing .ch.l{transform:translateX(14px) rotate(13deg);}
  .pair.kissing .ch.r{transform:translateX(-14px) rotate(-13deg);}
  #kiss[data-phase="malam"] #pop{bottom:168px;}
  #pop{position:absolute; left:50%; bottom:112px; width:26px; height:26px;
       opacity:0; pointer-events:none; transform:translateX(-50%);}
  #pop.go{animation:fly .8s steps(6) forwards;}
  @keyframes fly{
    0%{opacity:1; transform:translate(-50%,0) scale(.5)}
    100%{opacity:0; transform:translate(-50%,-54px) scale(1.6)}
  }
  #tally{position:absolute; top:10px; left:12px; font-size:13px; color:var(--wood);
         background:rgba(255,255,255,.8); padding:4px 7px; border:3px solid var(--wood);}
  #kisshint{position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:9px; color:#3E6B2E;}
  #kiss[data-phase="malam"] #kisshint{color:#CFE9FF;}

  @media (max-height:620px), (max-width:620px){
    #kiss[data-phase="malam"]{--rope:92px; --sit:78px;}
  }
  @media (max-width:620px){
    #win{padding:14px; gap:10px;}
    .top{gap:10px;}
    .side{width:66px; flex:0 0 66px; gap:7px;}
    .portrait{width:66px;height:66px;}
    .pad{gap:7px;}
    .key svg{width:18px;height:18px;}
    .mine-face{width:56px;height:56px;flex:0 0 56px;}
    .pair .ch{width:62px;height:62px;}
    .pair{gap:24px;}
  }
</style>
</head>

/* Ganti jadi lagu sendiri: taruh lagu.mp3 di sebelah index.html, lalu

   lagu.loop = true;  startMusic = ()=>lagu.play();  stopMusic = ()=>lagu.pause(); */
let musicGain = null, musicTimer = null, chordStep = 0;
const CHORDS = [
  [174.61, 261.63, 349.23, 440.00],  // F
  [130.81, 261.63, 329.63, 392.00],  // C
  [146.83, 293.66, 349.23, 440.00],  // Dm
  [116.54, 233.08, 293.66, 349.23]   // Bb
];
function startMusic(){
  if (!soundOn || musicTimer) return;
  const c = ctx(); if(!c) return;
  musicGain = c.createGain();
  musicGain.gain.setValueAtTime(0, c.currentTime);
  musicGain.gain.linearRampToValueAtTime(.075, c.currentTime + 4);
  const filt = c.createBiquadFilter();
  filt.type='lowpass'; filt.frequency.value = 1100; filt.Q.value = .4;
  filt.connect(musicGain); musicGain.connect(c.destination);

  const bar = () => {
    const notes = CHORDS[chordStep % CHORDS.length]; chordStep++;
    const t = c.currentTime;
    notes.forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = i === 0 ? 'sine' : 'triangle';
      o.frequency.value = f;
      o.detune.value = (i % 2 ? 4 : -4);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(i === 0 ? .32 : .16, t + 1.6);
      g.gain.linearRampToValueAtTime(0, t + 6.2);
      o.connect(g); g.connect(filt); o.start(t); o.stop(t + 6.4);
    });
    const b = c.createOscillator(), bg = c.createGain();   // denting tipis
    b.type='sine'; b.frequency.value = notes[3] * 2;
    bg.gain.setValueAtTime(0, t + 1.1);
    bg.gain.linearRampToValueAtTime(.06, t + 1.4);
    bg.gain.exponentialRampToValueAtTime(.0008, t + 4.2);
    b.connect(bg); bg.connect(filt); b.start(t + 1.1); b.stop(t + 4.3);
  };
  bar(); musicTimer = setInterval(bar, 6000);
}
function stopMusic(){
  clearInterval(musicTimer); musicTimer = null;
  if (musicGain && actx){
    musicGain.gain.cancelScheduledValues(actx.currentTime);
    musicGain.gain.setValueAtTime(musicGain.gain.value, actx.currentTime);
    musicGain.gain.linearRampToValueAtTime(0, actx.currentTime + 1.5);
  }
}

    <div class="bubble b-${m.who}">${esc(m.text)}</div>
    <span class="meta"><span class="time">${clock(m.t)}</span>${m.who===me?'<span class="tick"></span>':''}</span>`;
  $('msgs').appendChild(el);
  if (m.who===me){ mine.push({t:m.t, key, node:el.querySelector('.tick')}); paintTicks(); }
  if (near || m.who===me) $('msgs').scrollTop = $('msgs').scrollHeight;
}

function paintTicks(){
  mine.forEach(x=>{
    let cls='', label='belum sampai', icon='';
    if (theirSeen >= x.t){ cls='read'; label='dibaca'; icon=CHECK+CHECK; }
    else if (theirHere || theirLastOn >= x.t){ label='sampai'; icon=CHECK; }
    x.node.className = 'tick ' + cls;
    x.node.innerHTML = icon + '<span>'+label+'</span>';
  });
}
function presence(){
  $('here').textContent = theirHere ? 'lagi buka'
    : (theirLastOn ? 'terakhir '+clock(theirLastOn) : 'offline');
  paintTicks();
}

/* ---------- hapus pesan ---------- */
let hapus = () => {};
let hapusSemua = () => {};

function lepas(key){
  const el = rows[key]; if (el) el.remove();
  delete rows[key];
  const i = mine.findIndex(x => x.key === key);
  if (i > -1) mine.splice(i, 1);
  if (!$('msgs').querySelector('.row')) $('empty').style.display = 'block';
}

$('msgs').addEventListener('click', e => {
  const row = e.target.closest('.row.mine');
  if (!row || !row.dataset.key) return;
  if (e.target.classList.contains('del')) { hapus(row.dataset.key); return; }
  document.querySelectorAll('.del').forEach(b => b.remove());
  const b = document.createElement('button');
  b.className = 'del'; b.textContent = 'hapus';
  row.querySelector('.meta').appendChild(b);
  setTimeout(() => b.remove(), 4000);
});

let siap = false;
$('wipe').addEventListener('click', () => {
  if (!siap) {
    siap = true;
    $('wipe').textContent = 'yakin? pencet lagi';
    $('wipe').classList.add('armed');
    setTimeout(() => { siap = false; $('wipe').textContent = 'hapus semua'; $('wipe').classList.remove('armed'); }, 4000);
    return;
  }
  siap = false; $('wipe').textContent = 'hapus semua'; $('wipe').classList.remove('armed');
  hapusSemua();
});

/* ---------- stiker ---------- */
$('stickBtn').addEventListener('click', ()=> $('stickers').classList.toggle('on'));
$('stickers').querySelectorAll('button').forEach(b =>
  b.addEventListener('click', ()=>{ say(b.textContent); $('stickers').classList.remove('on'); }));

/* ---------- adegan cium ---------- */
let kissMode=false, kisses=0, kissTimer=null;
function faces(k){ $('chL').innerHTML = standee('banana',k); $('chR').innerHTML = standee('avocado',k); }
function setKiss(on){
  kissMode = on;
  $('kiss').classList.toggle('on', on);
  $('kissBtn').classList.toggle('on', on);
  faces(false);
  if (on) { setPhase(); startMusic(); } else { stopMusic(); flushKisses(); }
}
$('kissBtn').addEventListener('click', ()=> setKiss(!kissMode));
$('kiss').addEventListener('click', ()=>{
  kisses++;
  $('tally').textContent = kisses + 'x';
  $('kisshint').textContent = kisses > 4 ? 'jangan berhenti' : 'tap mereka';
  $('pair').classList.add('kissing');
  faces(true);
  $('pop').classList.remove('go'); void $('pop').offsetWidth; $('pop').classList.add('go');
  blip(1180);
  clearTimeout(kissTimer);
  const hold = $('kiss').dataset.phase === 'malam' ? 1300 : 520;
  setTimeout(()=>{ $('pair').classList.remove('kissing'); faces(false); }, hold);
  kissTimer = setTimeout(flushKisses, 3500);
});
function flushKisses(){
  clearTimeout(kissTimer);
  if (kisses > 0){
    say(`${NAMES[me]} sent kiss ${kisses}x 💋`);
    kisses = 0; $('tally').textContent = '0x';
  }
}

/* ---------- firebase ---------- */
let say = () => {};
let seeAll = () => {};
let demo = false;

if (CONFIG.apiKey.startsWith('PASTE')) {
  demo = true;
  $('here').textContent = 'mode coba';
  $('note').textContent = 'mode coba: pesan cuma muncul di layar ini, belum kekirim ke dia.';
  hapus = key => lepas(key);
  hapusSemua = () => { Object.keys(rows).forEach(lepas); };
  say = text => {
    text = String(text).trim(); if (!text) return;
    draw({ who: me, text, t: Date.now() }, 'x' + Date.now());
    setTimeout(()=>{ theirLastOn = Date.now(); paintTicks(); }, 700);
    setTimeout(()=>{ theirSeen = Date.now(); paintTicks(); }, 1800);
  };
} else {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const { getDatabase, ref, push, set, remove, onValue, onChildAdded, onChildRemoved, onDisconnect, query, limitToLast, serverTimestamp }
    = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");

  const app = initializeApp(CONFIG);
  const db  = getDatabase(app);
  const auth = getAuth(app);
  const base = 'rooms/' + ROOM;
  const msgsRef = ref(db, base + '/messages');
  let lastKnown = Number(store.get('lastKnown') || 0);
  let started = false;

  const PESAN = {
    'auth/invalid-credential':'email atau password salah',
    'auth/invalid-login-credentials':'email atau password salah',
    'auth/wrong-password':'email atau password salah',
    'auth/user-not-found':'email belum terdaftar',
    'auth/invalid-email':'format emailnya belum bener',
    'auth/too-many-requests':'kebanyakan salah, tunggu sebentar',
    'auth/network-request-failed':'internetnya lagi bermasalah',
    'auth/operation-not-allowed':'aktifkan Email/Password di Firebase > Authentication'
  };
  async function login(){
    const em = $('mail').value.trim().toLowerCase();
    if (!EMAILS[em]) { $('lgerr').textContent = 'email ini belum didaftarkan di app'; return; }
    $('lgerr').textContent = 'sebentar...';
    try { await signInWithEmailAndPassword(auth, em, $('pass').value); }
    catch(e){ $('lgerr').textContent = PESAN[e.code] || ('gagal: ' + e.code); }
  }
  $('masuk').addEventListener('click', login);
  $('pass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  $('mail').addEventListener('keydown', e => { if (e.key === 'Enter') $('pass').focus(); });
  window.keluar = () => signOut(auth).then(()=>location.reload());

  onAuthStateChanged(auth, user => {
    if (!user) { $('login').classList.add('on'); $('mail').focus(); return; }
    const peran = EMAILS[(user.email||'').toLowerCase()];
    if (!peran) { $('lgerr').textContent = 'email ini belum didaftarkan di app'; signOut(auth); return; }
    me = peran; you = me === 'banana' ? 'avocado' : 'banana';
    store.set('me', me);
    renderIdentity();
    $('login').classList.remove('on');
    $('lgerr').textContent = '';
    if (started) return;
    started = true;

    const meHere   = ref(db, base + '/here/' + me);
    const meLastOn = ref(db, base + '/lastOn/' + me);
    const meSeen   = ref(db, base + '/seen/' + me);
    seeAll = () => set(meSeen, Date.now()).catch(()=>{});

    set(meHere, true); set(meLastOn, Date.now());
    onDisconnect(meHere).set(false);
    onDisconnect(meLastOn).set(serverTimestamp());
    setInterval(()=> set(meLastOn, Date.now()).catch(()=>{}), 30000);
    document.addEventListener('visibilitychange', ()=>{
      set(meHere, !document.hidden).catch(()=>{});
      if (!document.hidden && open()) seeAll();
    });

    onValue(ref(db, base+'/here/'+you),   s => { theirHere = s.val() === true; presence(); });
    onValue(ref(db, base+'/lastOn/'+you), s => { theirLastOn = Number(s.val()||0); presence(); });
    onValue(ref(db, base+'/seen/'+you),   s => { theirSeen = Number(s.val()||0); paintTicks(); });

    onChildRemoved(msgsRef, snap => lepas(snap.key));

    hapus = key => remove(ref(db, base + '/messages/' + key))
      .catch(() => { $('note').textContent = 'gagal hapus'; });
    hapusSemua = () => remove(msgsRef)
      .then(() => { $('note').textContent = 'chat dikosongkan'; })
      .catch(() => { $('note').textContent = 'gagal hapus'; });

    onChildAdded(query(msgsRef, limitToLast(200)), snap => {
      const m = snap.val(); if (!m) return;
      draw(m, snap.key);
      const t = m.t || Date.now();
      if (m.who === you && t > lastKnown){
        lastKnown = t; store.set('lastKnown', String(t));
        if (!open() || document.hidden){ unread++; badge(); blip(880); toast(m.text); }
      }
      if (open() && !document.hidden){ unread = 0; badge(); seeAll(); }
    });

    say = async text => {
      text = String(text).trim(); if (!text) return;
      try { await push(msgsRef, { who: me, text, t: Date.now(), s: serverTimestamp() }); $('note').textContent=''; }
      catch(e){ $('note').textContent = 'gagal terkirim'; }
    };
  });
}

$('go').addEventListener('click', ()=>{ say($('text').value); $('text').value=''; });
$('text').addEventListener('keydown', e=>{ if(e.key==='Enter'){ say($('text').value); $('text').value=''; } });
window.addEventListener('pagehide', flushKisses);
</script>

  [146.83, 293.66, 349.23, 440.00],  // Dm
  [116.54, 233.08, 293.66, 349.23]   // Bb
];
function startMusic(){
  if (!soundOn || musicTimer) return;
  const c = ctx(); if(!c) return;
  musicGain = c.createGain();
  musicGain.gain.setValueAtTime(0, c.currentTime);
  musicGain.gain.linearRampToValueAtTime(.075, c.currentTime + 4);
  const filt = c.createBiquadFilter();
  filt.type='lowpass'; filt.frequency.value = 1100; filt.Q.value = .4;
  filt.connect(musicGain); musicGain.connect(c.destination);

  const bar = () => {
    const notes = CHORDS[chordStep % CHORDS.length]; chordStep++;
    const t = c.currentTime;
    notes.forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = i === 0 ? 'sine' : 'triangle';
      o.frequency.value = f;
      o.detune.value = (i % 2 ? 4 : -4);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(i === 0 ? .32 : .16, t + 1.6);
      g.gain.linearRampToValueAtTime(0, t + 6.2);
      o.connect(g); g.connect(filt); o.start(t); o.stop(t + 6.4);
    });
    const b = c.createOscillator(), bg = c.createGain();   // denting tipis
    b.type='sine'; b.frequency.value = notes[3] * 2;
    bg.gain.setValueAtTime(0, t + 1.1);
    bg.gain.linearRampToValueAtTime(.06, t + 1.4);
    bg.gain.exponentialRampToValueAtTime(.0008, t + 4.2);
    b.connect(bg); bg.connect(filt); b.start(t + 1.1); b.stop(t + 4.3);
  };
  bar(); musicTimer = setInterval(bar, 6000);
}
function stopMusic(){
  clearInterval(musicTimer); musicTimer = null;
  if (musicGain && actx){
    musicGain.gain.cancelScheduledValues(actx.currentTime);
    musicGain.gain.setValueAtTime(musicGain.gain.value, actx.currentTime);
    musicGain.gain.linearRampToValueAtTime(0, actx.currentTime + 1.5);
  }
}

/* ---------- waktu di adegan ---------- */
const PAKSA = new URLSearchParams(location.search).get('waktu'); // ?waktu=malam buat ngetes
function setPhase(){
  if (PAKSA) { $('kiss').dataset.phase = PAKSA; return; }
  const h = new Date().getHours();
  const f = h >= 5 && h < 10 ? 'pagi' : h >= 10 && h < 15 ? 'siang' : h >= 15 && h < 18 ? 'sore' : 'malam';
  $('kiss').dataset.phase = f;
  $('note').dataset.jam = h;
}
window.waktu = f => { $('kiss').dataset.phase = f; };
setPhase(); setInterval(setPhase, 300000);

/* ---------- buka tutup ---------- */
let unread = 0;
const open = () => document.body.classList.contains('open');
/* sekali seumur hidup: coba set ukuran jendela app biar pas */
if (matchMedia('(display-mode: standalone)').matches && !store.get('sized')) {
  store.set('sized', '1');
  try { window.resizeTo(700, 660); } catch(e) {}
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
function badge(){
  $('bang').classList.toggle('on', unread>0);
  document.title = unread ? '! ' + JUDUL : JUDUL;
  try {
    if (unread > 0) navigator.setAppBadge && navigator.setAppBadge(unread);
    else navigator.clearAppBadge && navigator.clearAppBadge();
  } catch(e) {}
}
function toast(text){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (!document.hidden) return;
  try { new Notification(NAMES[you], { body: text, icon: 'icon-192.png', tag: 'chat' }); } catch(e) {}
}
$('launcher').addEventListener('click', ()=>{
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  document.body.classList.add('open'); unread=0; badge(); seeAll();
  $('msgs').scrollTop = $('msgs').scrollHeight;
});
$('closeBtn').addEventListener('click', ()=>{ stopMusic(); flushKisses(); document.body.classList.remove('open'); });

/* ---------- chat ---------- */
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clock = t => t ? new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
const CHECK = `<svg viewBox="0 0 10 8"><rect x="0" y="4" width="2" height="2" fill="currentColor"/><rect x="2" y="6" width="2" height="2" fill="currentColor"/><rect x="4" y="4" width="2" height="2" fill="currentColor"/><rect x="6" y="2" width="2" height="2" fill="currentColor"/><rect x="8" y="0" width="2" height="2" fill="currentColor"/></svg>`;
const mine = [];
let theirHere = false, theirLastOn = 0, theirSeen = 0;

function draw(m){
  $('empty').style.display = 'none';
  const near = $('msgs').scrollHeight - $('msgs').scrollTop - $('msgs').clientHeight < 100;
  const el = document.createElement('div');
  el.className = 'row' + (m.who===me ? ' mine' : ' theirs');
  el.innerHTML = `<span class="av" style="background:${ART[m.who].bg}">${avatar(m.who)}</span>
    <div class="bubble b-${m.who}">${esc(m.text)}</div>
    <span class="meta"><span class="time">${clock(m.t)}</span>${m.who===me?'<span class="tick"></span>':''}</span>`;
  $('msgs').appendChild(el);
  if (m.who===me){ mine.push({t:m.t, node:el.querySelector('.tick')}); paintTicks(); }
  if (near || m.who===me) $('msgs').scrollTop = $('msgs').scrollHeight;
}

function paintTicks(){
  mine.forEach(x=>{
    let cls='', label='undelivered', icon='';
    if (theirSeen >= x.t){ cls='read'; label='dibaca'; icon=CHECK+CHECK; }
    else if (theirHere || theirLastOn >= x.t){ label='delivered'; icon=CHECK; }
    x.node.className = 'tick ' + cls;
    x.node.innerHTML = icon + '<span>'+label+'</span>';
  });
}
function presence(){
  $('here').textContent = theirHere ? 'lagi buka'
    : (theirLastOn ? 'terakhir '+clock(theirLastOn) : 'offline');
  paintTicks();
}

/* ---------- stiker ---------- */
$('stickBtn').addEventListener('click', ()=> $('stickers').classList.toggle('on'));
$('stickers').querySelectorAll('button').forEach(b =>
  b.addEventListener('click', ()=>{ say(b.textContent); $('stickers').classList.remove('on'); }));

/* ---------- adegan cium ---------- */
let kissMode=false, kisses=0, kissTimer=null;
function faces(k){ $('chL').innerHTML = standee('banana',k); $('chR').innerHTML = standee('avocado',k); }
function setKiss(on){
  kissMode = on;
  $('kiss').classList.toggle('on', on);
  $('kissBtn').classList.toggle('on', on);
  faces(false);
  if (on) { setPhase(); startMusic(); } else { stopMusic(); flushKisses(); }
}
$('kissBtn').addEventListener('click', ()=> setKiss(!kissMode));
$('kiss').addEventListener('click', ()=>{
  kisses++;
  $('tally').textContent = kisses + 'x';
  $('kisshint').textContent = kisses > 4 ? 'jangan berhenti' : 'tap mereka';
  $('pair').classList.add('kissing');
  faces(true);
  $('pop').classList.remove('go'); void $('pop').offsetWidth; $('pop').classList.add('go');
  blip(1180);
  clearTimeout(kissTimer);
  const hold = $('kiss').dataset.phase === 'malam' ? 1300 : 520;
  setTimeout(()=>{ $('pair').classList.remove('kissing'); faces(false); }, hold);
  kissTimer = setTimeout(flushKisses, 3500);
});
function flushKisses(){
  clearTimeout(kissTimer);
  if (kisses > 0){
    say(`${NAMES[me]} sent kiss ${kisses}x 💋`);
    kisses = 0; $('tally').textContent = '0x';
  }
}

/* ---------- firebase ---------- */
let say = () => {};
let seeAll = () => {};
let demo = false;

if (CONFIG.apiKey.startsWith('PASTE')) {
  demo = true;
  $('here').textContent = 'mode coba';
  $('note').textContent = 'mode coba: pesan cuma muncul di layar ini, belum kekirim ke dia.';
  say = text => {
    text = String(text).trim(); if (!text) return;
    draw({ who: me, text, t: Date.now() });
    setTimeout(()=>{ theirLastOn = Date.now(); paintTicks(); }, 700);
    setTimeout(()=>{ theirSeen = Date.now(); paintTicks(); }, 1800);
  };
} else {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const { getDatabase, ref, push, set, onValue, onChildAdded, onDisconnect, query, limitToLast, serverTimestamp }
    = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");

  const app = initializeApp(CONFIG);
  const db  = getDatabase(app);
  const auth = getAuth(app);
  const base = 'rooms/' + ROOM;
  const msgsRef = ref(db, base + '/messages');
  let lastKnown = Number(store.get('lastKnown') || 0);
  let started = false;

  const PESAN = {
    'auth/invalid-credential':'email atau password salah',
    'auth/invalid-login-credentials':'email atau password salah',
    'auth/wrong-password':'email atau password salah',
    'auth/user-not-found':'email belum terdaftar',
    'auth/invalid-email':'format emailnya belum bener',
    'auth/too-many-requests':'kebanyakan salah, tunggu sebentar',
    'auth/network-request-failed':'internetnya lagi bermasalah',
    'auth/operation-not-allowed':'aktifkan Email/Password di Firebase > Authentication'
  };
  async function login(){
    const em = $('mail').value.trim().toLowerCase();
    if (!EMAILS[em]) { $('lgerr').textContent = 'email ini belum didaftarkan di app'; return; }
    $('lgerr').textContent = 'sebentar...';
    try { await signInWithEmailAndPassword(auth, em, $('pass').value); }
    catch(e){ $('lgerr').textContent = PESAN[e.code] || ('gagal: ' + e.code); }
  }
  $('masuk').addEventListener('click', login);
  $('pass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  $('mail').addEventListener('keydown', e => { if (e.key === 'Enter') $('pass').focus(); });
  window.keluar = () => signOut(auth).then(()=>location.reload());

  onAuthStateChanged(auth, user => {
    if (!user) { $('login').classList.add('on'); $('mail').focus(); return; }
    const peran = EMAILS[(user.email||'').toLowerCase()];
    if (!peran) { $('lgerr').textContent = 'email ini belum didaftarkan di app'; signOut(auth); return; }
    me = peran; you = me === 'banana' ? 'avocado' : 'banana';
    store.set('me', me);
    renderIdentity();
    $('login').classList.remove('on');
    $('lgerr').textContent = '';
    if (started) return;
    started = true;

    const meHere   = ref(db, base + '/here/' + me);
    const meLastOn = ref(db, base + '/lastOn/' + me);
    const meSeen   = ref(db, base + '/seen/' + me);
    seeAll = () => set(meSeen, Date.now()).catch(()=>{});

    set(meHere, true); set(meLastOn, Date.now());
    onDisconnect(meHere).set(false);
    onDisconnect(meLastOn).set(serverTimestamp());
    setInterval(()=> set(meLastOn, Date.now()).catch(()=>{}), 30000);
    document.addEventListener('visibilitychange', ()=>{
      set(meHere, !document.hidden).catch(()=>{});
      if (!document.hidden && open()) seeAll();
    });

    onValue(ref(db, base+'/here/'+you),   s => { theirHere = s.val() === true; presence(); });
    onValue(ref(db, base+'/lastOn/'+you), s => { theirLastOn = Number(s.val()||0); presence(); });
    onValue(ref(db, base+'/seen/'+you),   s => { theirSeen = Number(s.val()||0); paintTicks(); });

    onChildAdded(query(msgsRef, limitToLast(200)), snap => {
      const m = snap.val(); if (!m) return;
      draw(m);
      const t = m.t || Date.now();
      if (m.who === you && t > lastKnown){
        lastKnown = t; store.set('lastKnown', String(t));
        if (!open() || document.hidden){ unread++; badge(); blip(880); toast(m.text); }
      }
      if (open() && !document.hidden){ unread = 0; badge(); seeAll(); }
    });

    say = async text => {
      text = String(text).trim(); if (!text) return;
      try { await push(msgsRef, { who: me, text, t: Date.now(), s: serverTimestamp() }); $('note').textContent=''; }
      catch(e){ $('note').textContent = 'gagal terkirim'; }
    };
  });
}

$('go').addEventListener('click', ()=>{ say($('text').value); $('text').value=''; });
$('text').addEventListener('keydown', e=>{ if(e.key==='Enter'){ say($('text').value); $('text').value=''; } });
window.addEventListener('pagehide', flushKisses);
</script>
